<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0F19">
  <title>Cloud Dojo - Quiz</title>
  <link rel="stylesheet" href="/src/css/variables.css">
  <link rel="stylesheet" href="/src/css/base.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/animations.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Quiz specific styles */
    .quiz-container { display: none; }
    .quiz-container.active { display: block; animation: fadeIn 0.3s; }
    .question-header { display: flex; justify-content: space-between; margin-bottom: var(--spacing-md); color: var(--text-secondary); font-size: 0.9rem;}
    .question-text { font-size: 1.2rem; margin-bottom: var(--spacing-lg); font-weight: 500;}
    
    .options-list { display: flex; flex-direction: column; gap: var(--spacing-sm); }
    .option-btn {
      width: 100%; text-align: left; padding: var(--spacing-md);
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-light);
      border-radius: var(--radius-sm); color: var(--text-primary);
      transition: all 0.2s;
    }
    .option-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); }
    .option-btn.selected { border-color: var(--aws-orange); background: rgba(255, 153, 0, 0.1); }
    .option-btn.correct { border-color: var(--success); background: rgba(52, 168, 83, 0.1); }
    .option-btn.wrong { border-color: var(--error); background: rgba(234, 67, 53, 0.1); }
    .option-btn:disabled { cursor: default; }

    .explanation-box {
      margin-top: var(--spacing-lg); padding: var(--spacing-md);
      background: rgba(66, 133, 244, 0.1); border-left: 4px solid var(--vertex-blue);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      display: none;
    }
    .explanation-box.active { display: block; animation: fadeIn 0.5s; }

    .action-bar { margin-top: var(--spacing-lg); display: flex; justify-content: space-between; }
    .btn-primary {
      background: var(--aws-orange); color: #000; font-weight: 600;
      padding: var(--spacing-sm) var(--spacing-lg); border-radius: var(--radius-sm);
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-text { color: var(--text-secondary); text-decoration: underline; padding: var(--spacing-md) var(--spacing-lg); margin-left: calc(-1 * var(--spacing-lg)); display: inline-block; }
  </style>
</head>
<body class="dark-theme">
  <div class="app-container">
    <header class="glass-header">
      <h1 id="courseTitle">Loading...</h1>
      <a href="./" class="btn-text">← 戻る</a>
    </header>

    <main class="glass-card">
      <div id="loadingIndicator">問題を読み込んでいます...</div>
      
      <!-- クイズ画面 -->
      <div id="quizContainer" class="quiz-container">
        <div class="question-header">
          <span id="questionCounter">Q 1 / ?</span>
          <span id="scoreTracker">正解: 0</span>
        </div>
        <h2 id="questionText" class="question-text"></h2>
        <div id="optionsContainer" class="options-list"></div>
        
        <div id="explanationBox" class="explanation-box">
          <h4 style="margin-bottom: 8px;">解説</h4>
          <p id="explanationText"></p>
        </div>

        <div class="action-bar">
          <div></div> <!-- Spacer -->
          <button id="nextBtn" class="btn-primary" disabled>次の問題へ</button>
        </div>
      </div>

      <!-- 結果画面 -->
      <div id="resultContainer" class="quiz-container text-center">
        <h2 style="margin-bottom: var(--spacing-lg);">クイズ完了！</h2>
        <div style="font-size: 3rem; margin-bottom: var(--spacing-md);">🎉</div>
        <h3 id="finalScore" style="color: var(--aws-orange); margin-bottom: var(--spacing-xl);"></h3>
        <button id="homeBtn" class="btn-primary">ホームへ戻る</button>
      </div>

    </main>
  </div>

  <script type="module" src="/src/js/quiz.js"></script>
</body>
</html>
